name: Flutter Nightly Build

on:
  # laztool：只保留手动触发。每晚一次全量 Windows 构建对定制分支没有价值，
  # 真要回归就走 flutter-tag.yml 打 tag。恢复定时构建把这行 schedule 加回来即可。
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      # 不能再用 `nightly`：master 分支的上游定时构建（每天 0 点 UTC）也发到同一个
      # release tag，会把定制产物覆盖成上游产物。定制分支固定用自己的 tag。
      upload-tag: "laztool-nightly"
